[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-Pianifica"
version = "0.1.0"
description = "Pianifica una stampa scegliendo l'ora a cui deve finire."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.8,<4"
dependencies = []

[project.entry-points."octoprint.plugin"]
pianifica = "octoprint_pianifica"

[tool.setuptools]
packages = ["octoprint_pianifica"]
include-package-data = true

[tool.setuptools.package-data]
octoprint_pianifica = ["templates/*.jinja2", "static/js/*.js", "static/css/*.css"]
