[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-FinishAt"
version = "0.2.1"
description = "Schedule a print by choosing the time it should finish."
authors = [
    {name = "Ale6699", email = "44789012+Ale6699@users.noreply.github.com"}
]
readme = {file = "README.md", content-type = "text/markdown"}
dynamic = [
    "license"
]

requires-python = ">=3.7, <4"

# any additional requirements (besides OctoPrint) should be listed here
dependencies = [
    "backports.zoneinfo; python_version < '3.9'"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_finishat",
    "octoprint_finishat.*"
]

[project.entry-points."octoprint.plugin"]
finishat = "octoprint_finishat"

[project.urls]
Homepage = "https://github.com/Ale6699/OctoPrint-FinishAt"

[project.optional-dependencies]
develop = [
    "go-task-bin"
]
